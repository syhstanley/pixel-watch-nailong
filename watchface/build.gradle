plugins {
    id 'com.android.application'
}

android {
    namespace 'com.stanley.nailongwatchface'
    compileSdk 34

    defaultConfig {
        applicationId "com.stanley.nailongwatchface"
        minSdk 33
        targetSdk 34
        versionCode 2
        versionName "2.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            res.srcDirs = ['res']
        }
    }
}
